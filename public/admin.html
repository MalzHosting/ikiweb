<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — MalzXploit</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav><a class="logo" href="/"><i></i>MALZXPLOIT / ADMIN</a><button class="del" id="out" hidden>Keluar</button></nav>
<div class="wrap">

  <div id="login" class="card" hidden>
    <h2 style="margin-bottom:0">Login admin</h2>
    <label for="u">Username</label><input id="u" autocomplete="username">
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
    <div class="err" id="e1"></div>
    <button class="btn" id="go">Masuk</button>
  </div>

  <div id="panel" hidden>
    <div class="card">
      <h2 style="margin-bottom:0">Tambah baru</h2>
      <label for="t">Jenis</label>
      <select id="t"><option value="project">Project</option><option value="product">Produk</option></select>
      <label for="n">Nama</label><input id="n" maxlength="80">
      <label for="d">Deskripsi singkat</label><textarea id="d" rows="3" maxlength="300"></textarea>
      <label for="l">Link (https://...)</label><input id="l" placeholder="https://">
      <label for="g">Label (opsional, misal Bot / Web)</label><input id="g" maxlength="20">
      <div class="err" id="e2"></div>
      <button class="btn lime" id="add">Simpan</button>
    </div>
    <div class="card" style="margin-top:40px">
      <h2 style="margin-bottom:0">Edit teks website</h2>
      <label for="f-intro">Kalimat perkenalan (beranda)</label><textarea id="f-intro" rows="3"></textarea>
      <label for="f-about1">Tentang saya, paragraf 1</label><textarea id="f-about1" rows="3"></textarea>
      <label for="f-about2">Tentang saya, paragraf 2</label><textarea id="f-about2" rows="2"></textarea>
      <label for="f-skills">Skill (pisahkan dengan koma)</label><textarea id="f-skills" rows="3"></textarea>
      <label for="f-location">Alamat / lokasi</label><input id="f-location">
      <label for="f-contact">Kalimat di bagian kontak</label><textarea id="f-contact" rows="2"></textarea>
      <label for="f-instagram">Instagram (tanpa @)</label><input id="f-instagram">
      <label for="f-telegram">Telegram (tanpa @)</label><input id="f-telegram">
      <label for="f-whatsapp">WhatsApp (angka, awali 62)</label><input id="f-whatsapp" inputmode="numeric">
      <div class="err" id="e3"></div>
      <button class="btn lime" id="saveSet">Simpan teks</button>
    </div>
    <h2 style="margin:40px 0 18px">Daftar</h2>
    <div id="list"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = (u, m, b) => fetch(u, { method: m || 'GET', headers: { 'Content-Type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Error'); return j; });

async function init(){
  const me = await api('/api/me');
  $('login').hidden = me.ok; $('panel').hidden = !me.ok; $('out').hidden = !me.ok;
  if (me.ok) { load(); loadSet(); }
}
async function load(){
  const list = await api('/api/projects');
  const box = $('list'); box.innerHTML = '';
  if (!list.length) { box.textContent = 'Masih kosong.'; return; }
  list.forEach(p => {
    const r = document.createElement('div'); r.className = 'row';
    const i = document.createElement('div');
    const b = document.createElement('b'); b.textContent = (p.type === 'product' ? '[Produk] ' : '[Project] ') + p.name;
    const s = document.createElement('small'); s.textContent = p.link || '(tanpa link)';
    i.append(b, s);
    const x = document.createElement('button'); x.className = 'del'; x.textContent = 'Hapus';
    x.onclick = async () => { if (confirm('Hapus "' + p.name + '"?')) { await api('/api/projects/' + encodeURIComponent(p.id), 'DELETE'); load(); } };
    r.append(i, x); box.append(r);
  });
}
const KEYS = ['intro','about1','about2','location','contact','instagram','telegram','whatsapp','skills'];
async function loadSet(){ const c = await api('/api/settings'); KEYS.forEach(k => $('f-' + k).value = c[k]); }
$('saveSet').onclick = async () => {
  const b = {}; KEYS.forEach(k => b[k] = $('f-' + k).value);
  try { await api('/api/settings', 'POST', b); $('e3').style.color = 'green'; $('e3').textContent = 'Tersimpan.'; loadSet(); }
  catch (e) { $('e3').style.color = '#b00020'; $('e3').textContent = e.message; }
};
$('go').onclick = async () => {
  try { await api('/api/login', 'POST', { username: $('u').value, password: $('p').value }); $('p').value = ''; init(); }
  catch (e) { $('e1').textContent = e.message; }
};
$('p').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('out').onclick = async () => { await api('/api/logout', 'POST'); init(); };
$('add').onclick = async () => {
  $('e2').textContent = '';
  try {
    await api('/api/projects', 'POST', { type: $('t').value, name: $('n').value, desc: $('d').value, link: $('l').value, tag: $('g').value });
    ['n','d','l','g'].forEach(k => $(k).value = ''); load();
  } catch (e) { $('e2').textContent = e.message; }
};
init();
</script>
</body>
</html>
