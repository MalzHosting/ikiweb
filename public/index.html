<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MalzXploit — Portofolio</title>
<meta name="description" content="Portofolio MalzXploit, programmer asal Cimahi, Jawa Barat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
  <a class="logo" href="#"><i></i>MALZXPLOIT</a>
  <div class="menu"><a href="#tentang">Tentang</a><a href="#project">Project</a><a href="#produk">Produk</a><a href="#kontak">Hubungi</a></div>
</nav>

<section class="hero">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="chips">
    <span class="chip" style="background:var(--pink);transform:rotate(-2deg)">PORTOFOLIO</span>
    <span class="chip" style="background:var(--ink);color:#fff">PROGRAMMER</span>
    <span class="chip" style="background:var(--lime)">CIMAHI, JABAR</span>
  </div>
  <h1>Membangun<br><mark>solusi</mark> digital<br>yang berguna.</h1>
  <p id="s-intro"></p>
  <div class="btns">
    <a class="btn dark" href="#project">Lihat Project</a>
    <a class="btn" href="#kontak">Hubungi Saya</a>
  </div>
</section>

<div class="marquee"><div id="mq"></div></div>

<section id="tentang">
  <h2>Tentang Saya</h2>
  <div class="about">
    <div class="foto"><img src="/foto.jpg" alt="Foto MalzXploit" onerror="this.remove();this.parentNode.textContent='M'"></div>
    <div class="card">
      <p style="margin-top:0" id="s-about1"></p>
      <p id="s-about2"></p>
      <span class="loc" id="s-loc"></span>
      <div class="stack" id="s-skills"></div>
    </div>
  </div>
</section>

<section id="project">
  <h2>Project yang Pernah Saya Buat</h2>
  <div class="grid" id="projects"></div>
</section>

<section id="produk">
  <h2>Produk Saya</h2>
  <div class="grid" id="products"></div>
</section>

<section id="kontak">
  <div class="card" style="background:var(--yellow)">
    <h2 style="margin-bottom:10px">Hubungi Saya</h2>
    <p style="margin:0 0 6px" id="s-contact"></p>
    <div class="btns">
      <a class="btn" id="s-ig" style="background:var(--pink)" target="_blank" rel="noopener"></a>
      <a class="btn" id="s-tg" style="background:var(--blue)" target="_blank" rel="noopener"></a>
      <a class="btn lime" id="s-wa" target="_blank" rel="noopener"></a>
    </div>
  </div>
</section>

<footer>© <span id="y"></span> MalzXploit</footer>

<script>
document.getElementById('y').textContent = new Date().getFullYear();
const mq = document.getElementById('mq');
const words = ['PROGRAMMER','CIMAHI','JAWA BARAT','JAVASCRIPT','PYTHON','PHP','NODE.JS','REST API','BOT','WEB','LINUX'];
mq.innerHTML = (words.map(w => `<span>${w} <b>◆</b></span>`).join('')).repeat(6);

function card(p){
  const el = document.createElement('div'); el.className = 'item';
  const tag = document.createElement('span'); tag.className = 'tag' + (p.type === 'product' ? ' product' : ''); tag.textContent = p.tag || (p.type === 'product' ? 'Produk' : 'Project');
  const h = document.createElement('h3'); h.textContent = p.name;
  const d = document.createElement('p'); d.textContent = p.desc;
  el.append(tag, h, d);
  if (p.link) { const a = document.createElement('a'); a.className = 'btn lime'; a.href = p.link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Buka'; a.style.textAlign = 'center'; el.append(a); }
  return el;
}
function fill(id, list, msg){
  const box = document.getElementById(id);
  if (!list.length) { box.innerHTML = '<div class="empty"></div>'; box.firstChild.textContent = msg; return; }
  list.forEach(p => box.append(card(p)));
}
fetch('/api/settings').then(r => r.json()).then(c => {
  const t = (id, v) => document.getElementById(id).textContent = v;
  t('s-intro', c.intro); t('s-about1', c.about1); t('s-about2', c.about2); t('s-contact', c.contact);
  t('s-loc', '📍 ' + c.location);
  const sk = document.getElementById('s-skills'); sk.innerHTML = '';
  String(c.skills || '').split(',').map(x => x.trim()).filter(Boolean).forEach(x => { const s = document.createElement('span'); s.textContent = x; sk.append(s); });
  const L = (id, href, label) => { const a = document.getElementById(id); a.href = href; a.textContent = label; };
  L('s-ig', 'https://instagram.com/' + c.instagram, 'Instagram @' + c.instagram);
  L('s-tg', 'https://t.me/' + c.telegram, 'Telegram @' + c.telegram);
  L('s-wa', 'https://wa.me/' + c.whatsapp, 'WhatsApp ' + c.whatsapp);
}).catch(() => {});
fetch('/api/projects').then(r => r.json()).then(all => {
  fill('projects', all.filter(p => p.type !== 'product'), 'Belum ada project yang ditampilkan.');
  fill('products', all.filter(p => p.type === 'product'), 'Belum ada produk yang ditampilkan.');
}).catch(() => fill('projects', [], 'Data gagal dimuat. Silakan muat ulang halaman.'));
</script>
</body>
</html>
