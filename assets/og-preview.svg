  <text x="600" y="237" text-anchor="middle" fill="#f5f5f5" font-family="monospace" font-size="48">HA</text>
  <text x="600" y="350" text-anchor="middle" fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="1">HIKMAL APRIANSYAH</text>
